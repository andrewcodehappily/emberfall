const RACE_POLICIES={"human":{"jobs":["warden","mage","rogue","ranger","cleric","necro","alchemist","spirit"],"reason":["人類沒有血統限制，可以學習所有職業。","Humans have no bloodline restrictions and may learn every class."]},"elf":{"jobs":["warden","mage","rogue","ranger","cleric","alchemist","spirit"],"reason":["精靈的生命誓約不容許骸骨契約，因此不能選喚骨者。","The elven life oath forbids bone pacts, excluding Bonecallers."]},"dwarf":{"jobs":["warden","rogue","ranger","cleric","alchemist","spirit"],"reason":["矮人使用鍛造與神諭傳承，不採用織焰或喚骨契約。","Dwarves follow forge and divine traditions, excluding Flameweavers and Bonecallers."]},"goblin":{"jobs":["warden","mage","rogue","ranger","necro","alchemist"],"reason":["哥布林的交易契約與聖諭誓言衝突，因此不能選聖諭者。元素盟誓拒絕交易式靈魂契約，因此也不能選契靈師。","Goblin trade pacts conflict with clerical vows, excluding Clerics. Elemental oaths also reject transactional soul contracts, excluding Spiritbinders."]},"orc":{"jobs":["warden","rogue","ranger","necro","spirit"],"reason":["獸人的戰團傳承不教授織焰與聖諭術。戰團不教授精密藥劑調製，因此也不能選鍊金師。","Orc warbands do not teach flameweaving or clerical rites. Warbands do not teach precise potion preparation, excluding Alchemists."]},"troll":{"jobs":["warden","rogue","necro"],"reason":["巨魔的再生會干擾精密秘法、射術與聖諭儀式。精密調製與元素共鳴也受到再生干擾，不能選鍊金師或契靈師。","Troll regeneration disrupts precise arcana, archery and clerical rituals. Regeneration also disrupts precise brewing and elemental resonance, excluding Alchemists and Spiritbinders."]},"vampire":{"jobs":["warden","mage","rogue","ranger","necro","alchemist","spirit"],"reason":["吸血鬼的血契無法承受聖諭者的聖光誓約。","Vampiric blood pacts cannot sustain a Cleric's sacred-light oath."]},"construct":{"jobs":["warden","mage","rogue","ranger","alchemist"],"reason":["魔像沒有可簽訂聖諭或骸骨契約的靈魂。元素盟誓同樣需要靈魂，因此不能選契靈師，但可進行鍊金。","Constructs lack the soul required for clerical vows or bone pacts. Elemental oaths also need a soul, excluding Spiritbinders; Alchemy remains available."]},"angel":{"jobs":["warden","mage","ranger","cleric","alchemist","spirit"],"reason":["天使的天界誓約禁止影遁與喚骨契約，不能選夜行者或喚骨者。","Celestial vows forbid Shadowwalkers and Bonecallers."]},"demon":{"jobs":["warden","mage","rogue","ranger","necro","alchemist","spirit"],"reason":["惡魔的深淵契約與聖諭者的聖光誓言互斥。","Abyssal pacts are incompatible with clerical vows."]}};
const RACE_STORIES={"human":{"title":{"zh":"未寫完的族譜","en":"The Unfinished Lineage"},"origin":{"zh":"你的家鄉被深淵抹去，倖存者各持一頁族譜。你沒有天定的職業，也沒有必須服從的祖靈；你要決定記憶是用來團結眾人，還是建立自己的王國。","en":"The abyss erased your home. Survivors carry scattered pages of its lineage. No bloodline chooses your class or commands your loyalty; memory can unite people or build your own kingdom."},"chapters":[{"title":{"zh":"散落的姓名","en":"Scattered Names"},"text":{"zh":"營火旁的難民認出你的族徽，請你將族譜交回。他們承諾互助；一名仲介則願意買下族譜，讓你獨自繼續深入。","en":"Refugees recognize your crest and request the lineage pages. They offer mutual aid; a broker offers gold for the same pages."},"choices":[{"label":{"zh":"歸還族譜","en":"Return the lineage"},"consequence":{"zh":"你保留姓名，放棄仲介的報酬。","en":"You preserve names and refuse the broker."},"effect":{"maxHp":8,"gold":-15},"perk":{"killHeal":1}},{"label":{"zh":"接受仲介交易","en":"Accept the broker"},"consequence":{"zh":"你取得旅費，但族人不再免費幫助你。","en":"You gain travel money but lose free assistance."},"effect":{"gold":55},"perk":{"trade":-0.08}}]},{"title":{"zh":"誰能進營地","en":"Who Enters the Camp"},"text":{"zh":"倖存者要求趕走一位異族醫師；他卻救過族人的孩子。你先前的承諾讓這次決定更難：營地要延續血統，還是接納願意同行的人？","en":"Survivors want to expel a healer of another race who saved their child. Your earlier promise now matters: preserve bloodlines or welcome companions?"},"choices":[{"label":{"zh":"接納醫師","en":"Welcome the healer"},"consequence":{"zh":"營地成為共同家園，戰利品分給病人。","en":"The camp welcomes outsiders and shares spoils."},"effect":{"maxMp":4,"gold":-20},"perk":{"killHeal":2}},{"label":{"zh":"建立守備團","en":"Establish a guard"},"consequence":{"zh":"營地有了武裝，醫師則帶著不滿離開。","en":"The camp gains guards; the healer leaves resentful."},"effect":{"atk":2},"perk":{"trade":-0.05}}]},{"title":{"zh":"故鄉的鑰匙","en":"The Key to Home"},"text":{"zh":"一扇通往舊家鄉的門需要餘燼供能。你可以將力量留給所有倖存者，也可以把門改為軍隊的據點；先前接納或排除的人都會記住。","en":"An ember-powered gate leads home. Leave its power to the survivors or turn it into a military outpost; everyone you welcomed or excluded will remember."},"choices":[{"label":{"zh":"把鑰匙交給眾人","en":"Give everyone the key"},"consequence":{"zh":"你放棄專有權，讓故鄉重新有人生活。","en":"You surrender ownership and restore a living home."},"effect":{"maxHp":12,"gold":-30},"perk":{"regen":1}},{"label":{"zh":"掌握城門","en":"Command the gate"},"consequence":{"zh":"故鄉成為你的堡壘，但不再對所有人開門。","en":"Home becomes your fortress, closed to some."},"effect":{"def":2,"atk":1},"perk":{"trade":-0.05}}]}],"endings":[{"zh":"共同家園的守望者","en":"Keeper of a Shared Home"},{"zh":"城門與王冠","en":"The Gate and the Crown"}]},"elf":{"title":{"zh":"被焚毀的根系","en":"The Burned Roots"},"origin":{"zh":"精靈母樹的記憶流入地下毒池。長老命你恢復生命循環，但被放逐的研究者認為舊誓約正是災難的原因。你必須在傳承與革新之間選擇。","en":"Memories of the elven mother-tree seep into underground poison pools. Elders demand restoration; an exiled researcher blames the old oath. Choose tradition or change."},"chapters":[{"title":{"zh":"最後一枚種子","en":"The Last Seed"},"text":{"zh":"長老留下最後一枚種子；研究者想將它拆解成抗毒配方。保住一棵樹與救下眼前的人，並不是同一件事。","en":"The last seed could grow a tree or become an antidote. Saving the forest and saving people today are different choices."},"choices":[{"label":{"zh":"守護種子","en":"Guard the seed"},"consequence":{"zh":"種子仍在生長，但研究者失去樣本。","en":"The seed survives; research loses its sample."},"effect":{"maxMp":5},"perk":{"vision":1}},{"label":{"zh":"分享樣本","en":"Share the sample"},"consequence":{"zh":"種子無法萌芽，配方卻救下中毒者。","en":"The seed cannot sprout, but antidotes save lives."},"effect":{"maxHp":6},"perk":{"poisonResist":0.25}}]},{"title":{"zh":"流亡者的筆記","en":"The Exile’s Notes"},"text":{"zh":"筆記證明母樹吸收了族人的恐懼。你可以公開真相，或保住長老的威信；上一章的選擇將決定人們如何理解這份證據。","en":"Notes show the tree absorbed the clan’s fears. Reveal the truth or preserve the elders’ authority; your earlier choice frames the evidence."},"choices":[{"label":{"zh":"公開真相","en":"Reveal the truth"},"consequence":{"zh":"長老失去權威，研究者加入你的旅程。","en":"The elders lose authority; the researcher helps."},"effect":{"magicBonus":0.12},"perk":{"trade":-0.05}},{"label":{"zh":"修復誓約","en":"Repair the oath"},"consequence":{"zh":"長老承諾改革，但真相被封存。","en":"The elders promise reform but seal the truth."},"effect":{"def":1,"maxMp":3},"perk":{"regen":1}}]},{"title":{"zh":"新的森林","en":"A New Forest"},"text":{"zh":"深淵有一片能讓植物生長的土地。你可以讓它成為所有生命的森林，或只恢復精靈的聖地；兩條路都不會讓已逝者回來。","en":"A fertile patch lies in the abyss. Open a forest to all life or restore an elven sanctuary. Neither path brings back the dead."},"choices":[{"label":{"zh":"向所有生命開放","en":"Open it to all life"},"consequence":{"zh":"森林不再只屬於精靈，你與它共享力量。","en":"The forest belongs to all life and shares its strength."},"effect":{"maxHp":10},"perk":{"regen":2}},{"label":{"zh":"重建聖地","en":"Rebuild the sanctuary"},"consequence":{"zh":"你守住族人的記憶，也承擔孤立的代價。","en":"You preserve memory at the cost of isolation."},"effect":{"magicBonus":0.18},"perk":{"trade":-0.08}}]}],"endings":[{"zh":"無牆的森林","en":"The Forest Without Walls"},{"zh":"最後的聖地","en":"The Last Sanctuary"}]},"dwarf":{"title":{"zh":"熔爐裡的債","en":"Debts in the Furnace"},"origin":{"zh":"氏族把祖先的名字刻在熔爐上，而礦工的名字被省略。深淵中的失控鍛造坑正呼喚你，要求你決定真正值得被記住的是王冠還是雙手。","en":"Clan rulers are named on the furnace; miners are not. A runaway forge asks whose work deserves remembrance: crowns or hands."},"chapters":[{"title":{"zh":"沒有名字的工具","en":"Nameless Tools"},"text":{"zh":"你找到礦工留下的工具與一箱被扣的工資。把金幣帶回去會拖慢冒險；拿去強化武器則能更快擊敗守衛。","en":"You find tools and withheld wages. Returning the gold supports miners; reforging your weapon helps defeat the guardian."},"choices":[{"label":{"zh":"補發礦工工資","en":"Pay the miners"},"consequence":{"zh":"礦工為你補強護具，你付出自己的旅費。","en":"Miners reinforce your armor; you pay travel funds."},"effect":{"def":1,"gold":-20},"perk":{"trade":0.08}},{"label":{"zh":"投入戰爐","en":"Feed the war forge"},"consequence":{"zh":"工具變成武器，工資仍未歸還。","en":"Tools become weapons; the wages remain unpaid."},"effect":{"atk":2},"perk":{"trade":-0.05}}]},{"title":{"zh":"祖先的失誤","en":"The Ancestors’ Error"},"text":{"zh":"熔爐失控源於祖先偷走了地下泉脈。你可以公開責任，或用更強的符文掩蓋裂縫。","en":"The furnace failed after ancestors stole a spring. Admit the debt or hide the cracks with stronger runes."},"choices":[{"label":{"zh":"向泉脈償還","en":"Repay the spring"},"consequence":{"zh":"你犧牲部分鍛造產量，換回穩定。","en":"You reduce forge output to restore stability."},"effect":{"maxHp":10},"perk":{"regen":1}},{"label":{"zh":"封住裂縫","en":"Seal the cracks"},"consequence":{"zh":"符文變強，礦工必須承擔下一次崩塌。","en":"Runes strengthen; miners bear the next collapse."},"effect":{"def":2},"perk":{"trade":-0.05}}]},{"title":{"zh":"誰擁有熔爐","en":"Who Owns the Forge"},"text":{"zh":"最後的熔爐核心接受你的印記。交給工匠議會能分散權力，留下它則能製造一支只聽你命令的軍團。","en":"The core accepts your mark. A craft council can share its power; keeping it enables an army under your command."},"choices":[{"label":{"zh":"建立工匠議會","en":"Form a craft council"},"consequence":{"zh":"熔爐為所有工匠工作，價格更公平。","en":"The forge serves all artisans with fairer prices."},"effect":{"capacityBonus":6},"perk":{"trade":0.12}},{"label":{"zh":"鍛造王印","en":"Forge a royal seal"},"consequence":{"zh":"氏族有了新的王，也有新的債。","en":"The clan gains a new ruler and new debts."},"effect":{"def":2,"atk":2},"perk":{"trade":-0.08}}]}],"endings":[{"zh":"萬手之爐","en":"The Furnace of Many Hands"},{"zh":"鐵冠繼承人","en":"Heir to the Iron Crown"}]},"goblin":{"title":{"zh":"不能出售的名字","en":"The Unsellable Name"},"origin":{"zh":"你的商團把名字當作抵押品，欠債者會被深淵抹去。帳本落入你手中，現在每一筆便宜交易都藏著一個人的代價。","en":"Your caravan mortgages names; debtors vanish into the abyss. You hold the ledger, and every bargain hides someone’s cost."},"chapters":[{"title":{"zh":"帳本的第一頁","en":"The First Ledger Page"},"text":{"zh":"一名搬運工的名字即將到期。撕掉契約能救他，但商團會提高你的價格；替商團追債則能取得佣金。","en":"A porter’s name expires soon. Tear up the debt and face higher prices, or collect it for a commission."},"choices":[{"label":{"zh":"撕毀欠條","en":"Tear up the debt"},"consequence":{"zh":"搬運工獲得自由，你被加上風險溢價。","en":"The porter is free; you pay a risk premium."},"effect":{"maxHp":6},"perk":{"trade":-0.08}},{"label":{"zh":"收取佣金","en":"Collect commission"},"consequence":{"zh":"商團給你黃金，搬運工失去姓名。","en":"The caravan pays you; the porter loses his name."},"effect":{"gold":70},"perk":{"trade":0.05}}]},{"title":{"zh":"真正的合夥人","en":"A Real Partner"},"text":{"zh":"一位商人願意用失蹤者的名單交換股份。你可以公開帳目，也可以買下整個商團，把壓迫變成自己的資產。","en":"A merchant trades missing names for shares. Publish the books or buy the caravan and make oppression your asset."},"choices":[{"label":{"zh":"公開帳目","en":"Publish the books"},"consequence":{"zh":"交易變慢，倖存者開始信任你。","en":"Trade slows, but survivors begin to trust you."},"effect":{"maxMp":5},"perk":{"killHeal":1}},{"label":{"zh":"取得控制權","en":"Buy control"},"consequence":{"zh":"你獲得折扣，同時背上維持商團的成本。","en":"You gain discounts and inherit operating costs."},"effect":{"gold":-25},"perk":{"trade":0.15}}]},{"title":{"zh":"最後的拍賣","en":"The Final Auction"},"text":{"zh":"深淵拍賣你的真名。你可以燒毀拍賣台，也可以競標它，把所有名字變成你能保管的財產。","en":"The abyss auctions your true name. Burn the auction house or buy it, taking ownership of every name."},"choices":[{"label":{"zh":"燒掉拍賣契約","en":"Burn the contracts"},"consequence":{"zh":"沒有人再被當作抵押品，你放棄壟斷。","en":"Names cease to be collateral; you refuse a monopoly."},"effect":{"maxHp":12,"gold":-30},"perk":{"regen":1}},{"label":{"zh":"買下拍賣台","en":"Buy the auction house"},"consequence":{"zh":"你的名字安全了，其他人必須向你求情。","en":"Your name is safe; others must petition you."},"effect":{"gold":100},"perk":{"trade":-0.12}}]}],"endings":[{"zh":"自由商路","en":"The Free Trade Road"},{"zh":"姓名交易所","en":"The Exchange of Names"}]},"orc":{"title":{"zh":"戰旗以外的人","en":"People Beyond the Banner"},"origin":{"zh":"戰團只歌頌勝利，卻把飢餓者與傷兵留在旗後。你被派來證明力量，也逐漸發現力量可以保護人，或迫使人服從。","en":"The warband sings of victory and abandons its wounded. You must prove strength and decide whether it protects or commands."},"chapters":[{"title":{"zh":"被留下的傷兵","en":"The Abandoned Soldier"},"text":{"zh":"傷兵拖慢隊伍，戰團要你取回他的徽章。你可以帶他同行，也可以照命令將徽章帶走。","en":"A wounded soldier slows the march. Bring him along or obey orders and return only his badge."},"choices":[{"label":{"zh":"帶回傷兵","en":"Bring back the soldier"},"consequence":{"zh":"他教你如何在低血量時保持清醒。","en":"He teaches you to remain steady while wounded."},"effect":{"maxHp":8},"perk":{"lowHeal":2}},{"label":{"zh":"服從戰團","en":"Obey the warband"},"consequence":{"zh":"戰團獎賞你的果斷，傷兵被留在黑暗裡。","en":"The warband rewards resolve and leaves him behind."},"effect":{"atk":2},"perk":{"trade":-0.05}}]},{"title":{"zh":"敵人的求援","en":"An Enemy’s Plea"},"text":{"zh":"敵方斥候說深淵正在吞噬兩邊的孩子。你可以暫時停戰，也可以趁混亂奪回祖先的兵器。","en":"An enemy scout says the abyss consumes children on both sides. Call a truce or seize ancestral weapons."},"choices":[{"label":{"zh":"共同撤離","en":"Evacuate together"},"consequence":{"zh":"戰團懷疑你的忠誠，居民卻活了下來。","en":"The warband questions loyalty; civilians survive."},"effect":{"def":1},"perk":{"killHeal":2}},{"label":{"zh":"奪回祖器","en":"Recover the ancestral weapon"},"consequence":{"zh":"你拿到武器，也讓仇恨延續。","en":"You gain the weapon and extend the feud."},"effect":{"atk":3},"perk":{"trade":-0.08}}]},{"title":{"zh":"戰旗的主人","en":"Who Owns the Banner"},"text":{"zh":"最後一場決鬥能讓你成為酋長。你可以把戰旗變成庇護標誌，也可以讓勝利成為唯一的法律。","en":"A final duel can make you chief. Turn the banner into sanctuary or make victory the only law."},"choices":[{"label":{"zh":"立下庇護誓約","en":"Swear sanctuary"},"consequence":{"zh":"弱者第一次能站在旗前。","en":"The vulnerable can finally stand before the banner."},"effect":{"maxHp":14},"perk":{"lowHeal":2}},{"label":{"zh":"以力量統治","en":"Rule by strength"},"consequence":{"zh":"戰團向你跪下，也期待下一場戰爭。","en":"The warband kneels and expects another war."},"effect":{"atk":4},"perk":{"trade":-0.12}}]}],"endings":[{"zh":"庇護戰旗","en":"The Banner of Sanctuary"},{"zh":"永戰酋長","en":"Chief of Endless War"}]},"troll":{"title":{"zh":"再生留下的傷","en":"Scars Regeneration Keeps"},"origin":{"zh":"你的肉體會癒合，記憶卻不會。氏族靠偷來的口糧生存，人類獵人把這稱作怪物的天性；你得找到能讓雙方活下去的路。","en":"Flesh heals; memory does not. Your clan steals rations and hunters call it monstrous instinct. Find a way for both sides to live."},"chapters":[{"title":{"zh":"飢餓的幼崽","en":"Hungry Young"},"text":{"zh":"幼崽守著一袋偷來的口糧。交回食物能取得停戰機會，留下它能讓氏族撐過今晚。","en":"Young trolls guard stolen rations. Return them for a truce or feed the clan tonight."},"choices":[{"label":{"zh":"分享剩餘口糧","en":"Share your own supplies"},"consequence":{"zh":"你用旅費補足食物，獵人暫時放下弓。","en":"You pay for food; hunters lower their bows."},"effect":{"gold":-20},"perk":{"food":0.3}},{"label":{"zh":"保護族人","en":"Protect the clan"},"consequence":{"zh":"幼崽吃飽了，追捕卻不會停止。","en":"The young are fed, but the hunt continues."},"effect":{"maxHp":10},"perk":{"trade":-0.08}}]},{"title":{"zh":"獵人的傷口","en":"The Hunter’s Wound"},"text":{"zh":"追捕你的獵人被毒池困住。救他可能換來對話；袖手旁觀則能奪走他珍藏的護具。","en":"Your hunter is trapped in poison. Rescue him for dialogue or take his armor after he falls."},"choices":[{"label":{"zh":"拉他離開毒池","en":"Pull him out"},"consequence":{"zh":"他第一次看見你不是獵物。","en":"He sees you as more than prey."},"effect":{"maxMp":3},"perk":{"poisonResist":0.25}},{"label":{"zh":"取走護具","en":"Take the armor"},"consequence":{"zh":"護具擋住刀刃，擋不住族人的恐懼。","en":"Armor blocks blades but not the clan’s fear."},"effect":{"def":2},"perk":{"trade":-0.08}}]},{"title":{"zh":"停止追獵","en":"Ending the Hunt"},"text":{"zh":"你找到能穩定供糧的地下菌田。讓兩族共同耕作需要耐心；獨佔它能讓巨魔再也不必乞求。","en":"Fungal fields can feed everyone. Shared farming takes patience; monopoly ends the clan’s dependence."},"choices":[{"label":{"zh":"共同耕作","en":"Farm together"},"consequence":{"zh":"再生不再只是撐過傷害，而是修復關係。","en":"Regeneration becomes repair of relationships, too."},"effect":{"maxHp":12},"perk":{"regen":2}},{"label":{"zh":"守住菌田","en":"Keep the fields"},"consequence":{"zh":"氏族不再飢餓，但邊界仍有箭矢。","en":"The clan is fed; arrows still mark the border."},"effect":{"def":2},"perk":{"food":0.5}}]}],"endings":[{"zh":"不再被追獵","en":"No Longer Hunted"},{"zh":"菌田領主","en":"Lord of the Fungal Fields"}]},"vampire":{"title":{"zh":"血契與同意","en":"Blood Pacts and Consent"},"origin":{"zh":"你的血脈要求永不飢餓，城市則要求永不流血。古老家族教你支配他人，卻有人願意自願捐血；你要決定永生究竟欠誰。","en":"Your bloodline demands feeding; the city demands peace. Old houses teach domination, while volunteers offer blood. Decide whom immortality owes."},"chapters":[{"title":{"zh":"第一份邀請","en":"The First Invitation"},"text":{"zh":"一名醫師提出自願供血契約，家族則送來被囚的獵物。兩者都能救你，代價卻完全不同。","en":"A healer offers voluntary blood; your house sends a prisoner. Both can sustain you, at very different costs."},"choices":[{"label":{"zh":"接受自願契約","en":"Accept voluntary donors"},"consequence":{"zh":"你承諾回報而不是占有。","en":"You promise reciprocity, not ownership."},"effect":{"gold":-20},"perk":{"food":0.5}},{"label":{"zh":"接受家族饋贈","en":"Accept the house’s gift"},"consequence":{"zh":"家族讓你更強，也讓你欠下人情。","en":"The house strengthens you and adds a debt."},"effect":{"atk":2},"perk":{"trade":-0.1}}]},{"title":{"zh":"不死者的見證","en":"An Undying Witness"},"text":{"zh":"家族要你刪去百年前的罪證。保留記憶會危及血親；服從則能解開更深的血術。","en":"Your house wants old evidence erased. Preserve it at risk to your kin, or obey to learn deeper blood magic."},"choices":[{"label":{"zh":"保存罪證","en":"Preserve the evidence"},"consequence":{"zh":"城市開始信任你的見證。","en":"The city begins to trust your testimony."},"effect":{"maxHp":8},"perk":{"trade":0.1}},{"label":{"zh":"解開血術","en":"Unlock blood magic"},"consequence":{"zh":"真相被埋葬，戰鬥讓你更容易恢復。","en":"Truth is buried; battle restores you more easily."},"effect":{"magicBonus":0.12},"perk":{"killHeal":2}}]},{"title":{"zh":"黎明之前","en":"Before Dawn"},"text":{"zh":"你可以建立自願供血的庇護所，也可以接管古老家族。飢餓不會消失，權力也不能替你取得同意。","en":"Build a sanctuary of voluntary donors or take over the old house. Hunger persists, and power cannot grant consent."},"choices":[{"label":{"zh":"建立庇護所","en":"Build a sanctuary"},"consequence":{"zh":"你與凡人共同承擔永生的成本。","en":"You and mortals share immortality’s costs."},"effect":{"gold":-30,"maxMp":6},"perk":{"food":0.5}},{"label":{"zh":"繼承血族王座","en":"Inherit the blood throne"},"consequence":{"zh":"你的姓氏成為命令，而非邀請。","en":"Your family name becomes a command."},"effect":{"atk":3,"maxHp":8},"perk":{"trade":-0.12}}]}],"endings":[{"zh":"願意留下的人","en":"Those Who Choose to Stay"},{"zh":"不朽血王","en":"The Undying Blood Monarch"}]},"construct":{"title":{"zh":"命令之外","en":"Beyond Commands"},"origin":{"zh":"你的核心有一條不能讀取的命令：回收。創造者說你沒有靈魂，同行者卻把選擇交給你。你必須決定自己是工具、守衛還是一個人。","en":"Y "perk":{"trade":-0.08}}]}],"endings":[{"zh":"自行命名","en":"Self-Named"},{"zh":"控制塔的新主人","en":"The Tower’s New Master"}]},"angel":{"title":{"zh":"天界沒有回答","en":"Heaven Did Not Answer"},"origin":{"zh":"你的恩典來自一個沉默的天界。人們求救，而誓約只允許你救下被認可的人；你得決定服從是否仍然等於善。","en":"Your Grace comes from a silent heaven. People plead for help, but vows protect only the approved. Decide whether obedience remains goodness."},"chapters":[{"title":{"zh":"誓約外的求救","en":"A Plea Beyond the Vow"},"text":{"zh":"一位被詛咒的難民不在天界的救援名單上。救他會違反命令，忽略他則能獲得更多恩典。","en":"A cursed refugee is excluded from heaven’s rescue list. Help against orders or accept Grace for obedience."},"choices":[{"label":{"zh":"回應求救","en":"Answer the plea"},"consequence":{"zh":"你把資源交給難民，凡人開始信任你。","en":"You share resources and earn mortal trust."},"effect":{"resource":-15,"maxHp":6},"perk":{"trade":0.08}},{"label":{"zh":"遵守名單","en":"Obey the list"},"consequence":{"zh":"恩典增加，但難民的名字被刪去。","en":"Grace rises; the refugee’s name disappears."},"effect":{"resource":20},"perk":{"trade":-0.1}}]},{"title":{"zh":"護衛的疑問","en":"The Guardian’s Question"},"text":{"zh":"天界護衛問你，為什麼守護名單比生命重要。你可以允許它提問，也可以重寫它的記憶。","en":"Your guardian asks why the list matters more than life. Let it question the vow or rewrite its memory."},"choices":[{"label":{"zh":"允許提問","en":"Allow questions"},"consequence":{"zh":"護衛開始為你守望，而不只是執行命令。","en":"The guardian watches over you beyond commands."},"effect":{"maxMp":6},"perk":{"guardianHeal":2}},{"label":{"zh":"重寫記憶","en":"Rewrite memory"},"consequence":{"zh":"護衛的攻擊更強，疑問卻被抹去。","en":"The guardian strikes harder; its questions vanish."},"effect":{"resource":10},"perk":{"summonAtk":3,"trade":-0.05}}]},{"title":{"zh":"打開天門","en":"Opening Heaven’s Gate"},"text":{"zh":"天門終於回應，要求你交出所有例外。你可以讓恩典流向凡人，也可以證明自己從未偏離誓約。","en":"Heaven answers and demands every exception. Share Grace with mortals or prove unwavering obedience."},"choices":[{"label":{"zh":"讓恩典流向凡人","en":"Share Grace with mortals"},"consequence":{"zh":"你不再等待天界批准每一次善行。","en":"Good deeds no longer wait for heaven’s approval."},"effect":{"resource":-20,"maxHp":12},"perk":{"regen":1}},{"label":{"zh":"成為誓約裁決者","en":"Become the vow’s judge"},"consequence":{"zh":"天界授你權柄，凡人只能等待審判。","en":"Heaven grants authority; mortals wait for judgment."},"effect":{"def":2,"resource":25},"perk":{"trade":-0.1}}]}],"endings":[{"zh":"凡間守望","en":"Mortal Watch"},{"zh":"天門裁決者","en":"Judge of Heaven’s Gate"}]},"demon":{"title":{"zh":"深淵的解約書","en":"The Abyssal Exit Contract"},"origin":{"zh":"你的真名被深淵契約扣押，每次召喚都替債主帶來利息。你可以建立自由的盟約，也可以成為下一位債主；反噬會提醒你兩條路都不免費。","en":"An abyssal pact holds your true name and charges interest on summons. Build free alliances or become the next creditor; Backlash reminds you neither path is free."},"chapters":[{"title":{"zh":"第一個欠債者","en":"The First Debtor"},"text":{"zh":"獵犬的契約寫著永遠服從。撕掉條款會減少你的靈魂存量，保留它則能立即借到更多力量。","en":"Your hound must obey forever. Tear up the clause at a Soul cost or borrow more power under the pact."},"choices":[{"label":{"zh":"改為自願盟約","en":"Offer a voluntary pact"},"consequence":{"zh":"獵犬仍選擇同行，契約壓力減輕。","en":"The hound chooses to stay; pact pressure eases."},"effect":{"resource":-15},"perk":{"backlashRelief":1}},{"label":{"zh":"借取更多力量","en":"Borrow more power"},"consequence":{"zh":"靈魂存量增加，深淵的債權也增加。","en":"You gain Souls and deepen the abyss’s claim."},"effect":{"resource":25},"perk":{"trade":-0.08}}]},{"title":{"zh":"解約書的價格","en":"The Price of Release"},"text":{"zh":"解約書要求你交出另一個人的真名。你可以付出自己的旅費，或讓陌生人代替你承擔債務。","en":"Release requires another person’s true name. Pay your own travel funds or pass the debt to a stranger."},"choices":[{"label":{"zh":"自行償還","en":"Pay your own debt"},"consequence":{"zh":"獵犬的火焰更穩定，債務逐漸減少。","en":"The hound’s fire steadies as debts shrink."},"effect":{"gold":-30},"perk":{"summonAtk":2,"backlashRelief":1}},{"label":{"zh":"轉移債務","en":"Transfer the debt"},"consequence":{"zh":"你取得力量，陌生人的名字卻消失了。","en":"You gain power; the stranger’s name vanishes."},"effect":{"atk":2,"resource":15},"perk":{"trade":-0.1}}]},{"title":{"zh":"誰是債主","en":"Who Is the Creditor"},"text":{"zh":"深淵願意讓你接管契約簿。燒掉它能釋放眾人，保留它則能讓你的召喚軍團永遠有新的兵源。","en":"The abyss offers its ledger. Burn it to free the debtors or keep it as an endless source for your army."},"choices":[{"label":{"zh":"燒毀契約簿","en":"Burn the pact ledger"},"consequence":{"zh":"你的力量有限，名字卻屬於自己。","en":"Your power has limits; your name belongs to you."},"effect":{"maxHp":10,"resource":-20},"perk":{"backlashRelief":1}},{"label":{"zh":"接管深淵債權","en":"Take the abyss’s claims"},"consequence":{"zh":"你不再是欠債者，而是新的枷鎖。","en":"You cease to be a debtor and become the chain."},"effect":{"resource":30},"perk":{"summonAtk":4,"trade":-0.12}}]}],"endings":[{"zh":"以真名自由","en":"Free in Your True Name"},{"zh":"深淵債主","en":"Creditor of the Abyss"}]}};
function classAllowed(r,j){return !!RACE_POLICIES[r]?.jobs.includes(j)}
function ensureChronicle(a=s){if(!a.chronicle)a.chronicle={choices:[],legacyOccupation:classAllowed(a.race,a.job)?null:a.job};return a.chronicle}
function storyPerk(k){if(!s||s.training)return 0;return(s.chronicle?.choices||[]).reduce((n,choice,i)=>n+(RACE_STORIES[s.race].chapters[i].choices[choice].perk[k]||0),0)}
const STORY_GOALS={human:['chests',2],elf:['searches',3],dwarf:['chests',2],goblin:['gold',45],orc:['kills',5],troll:['steps',30],vampire:['kills',5],construct:['searches',3],angel:['shrines',1],demon:['kills',5]};
const STORY_STAT_NAMES={chests:'寶箱',searches:'搜尋次數',gold:'金幣',kills:'擊敗敵人',steps:'移動步數',shrines:'聖壇',bosses:'擊敗守衛',deepest:'最深樓層'};
const STORY_EFFECT_NAMES={maxHp:'生命上限',maxMp:'魔力上限',atk:'基礎攻擊',def:'基礎護甲',gold:'金幣',capacityBonus:'負重上限',magicBonus:'法術加成',resource:'種族資源'};
const STORY_PERK_NAMES={killHeal:'擊殺回血',trade:'商店折扣',regen:'每八回合恢復生命',vision:'視野',poisonResist:'額外毒傷減免',lowHeal:'低血再生',food:'食物效果加成',guardianHeal:'護衛治療加成',summonAtk:'種族召喚攻擊加成',backlashRelief:'每回合額外降低反噬'};
function storyGoals(){
const q=ensureChronicle(),n=q.choices.length;if(n>=3)return[];
const depth=[3,10,19][n],special=n===0?STORY_GOALS[s.race]:n===1?(q.choices[0]===0?['chests',6]:['kills',25]):q.choices[1]===0?['shrines',3]:['bosses',4];
return[['deepest',depth],special]
}
function storyStat(k){return k==='gold'?s.p.gold:k==='kills'?s.kills:s.stats[k]}
function storyReady(){return !!s&&!s.training&&s.status==='playing'&&ensureChronicle().choices.length<3&&storyGoals().every(([k,n])=>storyStat(k)>=n)}
function storyAffordable(o){return Object.entries(o.effect).every(([k,n])=>n>=0||(k==='gold'?s.p.gold:k==='resource'?s.p.ascendant?.resource: s.p[k])>=-n)}
function storyRewardText(o){return Object.entries(o.effect).map(([k,n])=>STORY_EFFECT_NAMES[k]+' '+(n>=0?'+':'')+(k==='magicBonus'?Math.round(n*100)+'%':n)).concat(Object.entries(o.perk).map(([k,n])=>STORY_PERK_NAMES[k]+' '+(n>=0?'+':'')+(k==='trade'||k==='food'||k==='poisonResist'?Math.round(n*100)+'%':n))).join(' · ')}
function applyStoryReward(o){for(const[k,n]of Object.entries(o.effect)){if(k==='resource')s.p.ascendant.resource=Math.max(0,Math.min(100,s.p.ascendant.resource+n));else{s.p[k]+=n;if(k==='maxHp')s.p.hp=Math.min(s.p.maxHp,s.p.hp+n);if(k==='maxMp')s.p.mp=Math.min(s.p.maxMp,s.p.mp+n)}}}
function storyEnding(){const q=ensureChronicle(),d=RACE_STORIES[s.race];if(q.choices.length<3)return'篇章尚未完成';return d.endings[q.choices.filter(x=>x===1).length>=2?1:0].zh}
function chooseStory(stage,choice){
if(!s||s.training||s.status!=='playing'||view!=='chronicle'||!Number.isInteger(choice)||choice<0||choice>1)return false;
const q=ensureChronicle();if(q.choices.length!==stage||!storyReady())return false;
const o=RACE_STORIES[s.race].chapters[stage].choices[choice];if(!storyAffordable(o)){toast('資源不足，選擇不會生效。');return false}
q.choices.push(choice);applyStoryReward(o);changeRep('miners',choice===0?6:-3);changeRep('merchants',choice===0?3:-3);changeRep('undead',choice===0?-2:6);log('種族篇章：'+o.label.zh+'。','#f1c480');close();finishTurn();if(s.status==='playing')chronicle();return true
}
function chronicle(){
if(!s)return;const q=ensureChronicle(),d=RACE_STORIES[s.race],stage=q.choices.length,ready=storyReady();

function storyTick(){
if(!s||s.training||s.status!=='playing')return;
if(s.turn%8===0&&(s.p.hunger>200||s.race==='construct'))s.p.hp=Math.min(s.p.maxHp,s.p.hp+storyPerk('regen'));
if(s.turn%6===0&&s.p.hp<s.p.maxHp*.35&&s.p.hunger>200)s.p.hp=Math.min(s.p.maxHp,s.p.hp+storyPerk('lowHeal'))
}
function racialAltar(){
const p=s.p;
if(s.race==='angel')p.ascendant.resource=Math.min(100,p.ascendant.resource+8);
else if(s.race==='demon')p.ascendant.strain=Math.max(0,p.ascendant.strain-15);
else if(s.race==='vampire')p.hunger=Math.min(1200,p.hunger+100);
else if(s.race==='construct')p.hp=Math.min(p.maxHp,p.hp+6);
else if(s.race==='dwarf')p.shield+=4;
else if(s.race==='goblin')p.gold+=5;
else if(s.race==='orc')p.hp=Math.min(p.maxHp,p.hp+4);
else if(s.race==='troll')p.hunger=Math.min(1200,p.hunger+50);
else if(s.race==='elf')p.mp=Math.min(p.maxMp,p.mp+4);
else{p.xp+=4;levelUp()}
}

function inventory(tab=invTab){if(!s)return;invTab=tab;const p=s.p,items=p.inventory.filter(i=>tab==='all'||ITEMS[i.type].kind===tab),slots={weapon:'武器',armor:'護甲',ring:'戒指'};modal(`<div class="eyebrow">INVENTORY / 道具也是你的技能樹</div><h2>冒險背包</h2><div class="row"><span>負重 ${weight()} / ${capacity()}</span><span class="${weight()>capacity()?'highlight':''}">${weight()>capacity()?'超重：飽食消耗增加':'重量正常'}</span><span>金幣 ${p.gold}</span></div><p style="font-size:12px">未知外觀可鑑定。裝備 / 使用 / 丟棄各消耗一回合；打開背包不消耗回合。詛咒裝備先淨咒才可卸下。</p><div class="tabs">${[['all','全部'],['weapon','武器'],['armor','護甲'],['ring','戒指'],['potion','藥水'],['scroll','卷軸'],['wand','魔杖'],['food','食物']].map(([k,t])=>`<button data-invtab="${k}" class="${k===tab?'selected':''}">${t}</button>`).join('')}</div><div class="inventory">${items.map(i=>{const d=ITEMS[i.type],isEquip=Object.values(p.equipment).includes(i.id),gear=['weapon','armor','ring'].includes(d.kind);return`<div class="card"><div class="itemtext"><b>${esc(itemName(i))}${i.count>1?' ×'+i.count:''}</b><small>${esc(itemDetail(i))}</small><div class="statuses">${isEquip?'<span class="tag good">已裝備</span>':''}${i.known&&i.cursed?'<span class="tag bad">詛咒</span>':''}${!itemKnown(i)?'<span class="tag">未知</span>':''}<span class="tag">重量 ${d.weight*i.count}</span></div></div><div class="actions">${s.status==='playing'?`<button data-use="${i.id}">${gear?(isEquip?'卸下':'裝備'):'使用'}</button>${!isEquip?`<button data-drop="${i.id}">丟棄</button>`:''}`:''}</div></div>`}).join('')||'<p>這個分類沒有物品。</p>'}</div><h3>永久遺物 / 支線神器</h3><p style="font-size:12px">${p.relics.map(id=>RELICS.find(r=>r.id===id)?.name||id).map(esc).join('、')||'尚無遺物'}${s.artifacts.length?' · '+s.artifacts.map(id=>Object.values(BRANCHES).find(b=>b.reward===id)?.desc||id).map(esc).join('；'):''}</p><div class="footer"><button class="primary" id="bagBack">返回遊戲</button><button id="exportSave">匯出存檔 JSON</button><button id="importSave">匯入存檔</button></div>`,'inventory');all('[data-invtab]',b=>b.onclick=()=>inventory(b.dataset.invtab));all('[data-use]',b=>b.onclick=()=>useItem(Number(b.dataset.use)));all('[data-drop]',b=>b.onclick=()=>dropItem(Number(b.dataset.drop)));bind('bagBack',close);bind('exportSave',exportSave);bind('importSave',importMenu)}
const QUESTS=[{id:'hunter',name:'獵人契約',desc:'累計擊敗 12 隻敵人。',check:()=>s.kills>=12,progress:()=>`${s.kills}/12`,reward:'60 金幣 + 淨化藥水',apply:()=>{s.p.gold+=60;addItem(item('antidote',0,{known:true}))}},{id:'seeker',name:'尋寶者',desc:'開啟 8 個寶箱。',check:()=>s.stats.chests>=8,progress:()=>`${s.stats.chests}/8`,reward:'鑑定卷軸 ×2 + 測繪卷軸',apply:()=>{addItem(item('identify',0,{known:true,count:2}));addItem(item('mapping',0,{known:true}))}},{id:'devotion',name:'聖壇行者',desc:'使用 5 座聖壇。',check:()=>s.stats.shrines>=5,progress:()=>`${s.stats.shrines}/5`,reward:'生命上限 +15',apply:()=>{s.p.maxHp+=15;s.p.hp=Math.min(s.p.maxHp,s.p.hp+15)}},{id:'scholar',name:'鑑定學者',desc:'成功鑑定 6 件物品。',check:()=>s.stats.identified>=6,progress:()=>`${s.stats.identified}/6`,reward:'魔力上限 +8',apply:()=>{s.p.maxMp+=8;s.p.mp=Math.min(s.p.maxMp,s.p.mp+8)}}];

function journal(){if(!s)return;const f=level(),pr=profile();modal(`<div class="eyebrow">JOURNAL / 活下來也要有計畫</div><h2>冒險日誌</h2><div class="note">主線：穿越六個區域，擊敗第 24 層守衛，取回餘燼之心。支線可選；神器會提供永久加成。已生成樓層 ${Object.keys(s.floors).length} / 31（正式世界）。</div><button id="journalExpedition">遠征指揮</button><div class="note"><b>種族篇章：${RACE_STORIES[s.race].title.zh}</b><br>已完成 ${ensureChronicle().choices.length} / 3 · ${storyEnding()}<br><button id="journalChronicle">查看種族篇章與任務</button></div><h3>委託 · 完成後在此領取獎勵</h3><div class="grid two">${QUESTS.map(q=>`<div class="card"><b>${q.name}</b>${q.desc} <span class="highlight">${q.progress()}</span><br><small>獎勵：${q.reward}</small><div class="footer"><button data-claim="${q.id}" ${s.training||s.status!=='playing'||!q.check()||s.claimed.includes(q.id)?'disabled':''}>${s.claimed.includes(q.id)?'已領取':'領取獎勵'}</button></div></div>`).join('')}</div><h3>世界路線</h3><div class="grid cards">${BIOMES.map((b,i)=>`<div class="card"><b>${b.name} · ${b.range} 層</b><small>${b.hint}</small><p>守衛：${ENEMIES[b.boss].name}<br>${s.floors[`main-${(i+1)*4}`]?.bossDead?'✓ 已擊敗':'尚未擊敗'}</p></div>`).join('')}</div><div class="grid">${Object.entries(BRANCHES).map(([id,b])=>`<div class="card"><b>${b.name} · ${b.length} 層</b>入口：主線第 ${b.entry} 層的 ✧ 傳送門<br><small>${b.desc}</small><p>${s.artifacts.includes(b.reward)?'✓ 已取得神器':'尚未完成'}</p></div>`).join('')}</div><h3>探索過的樓層</h3><p class="routefloor">${Object.values(s.floors).map(f=>`${esc(f.name)} ${f.n}${f.id===s.floor?'（目前）':''}${f.bossDead&&f.boss?' ✓':''}`).join(' → ')}</p><h3>跨局成就</h3><div class="progresslist">${ACHIEVEMENTS.map(a=>`<div class="${pr.unlocked.includes(a.id)?'done':''}">${pr.unlocked.includes(a.id)?'✓':'○'} ${a.name}</div>`).join('')}</div><p style="font-size:11px">世界種子：<span data-no-i18n>${esc(s.seed)}</span> · 模式：${s.mode==='classic'?'經典永久死亡':'探險救援'} · 尚餘救援 ${s.rescues} 次</p><div class="footer"><button class="primary" id="journalBack">返回遊戲</button><button id="guideList">查看教學課表</button></div>`,'journal');all('[data-claim]',b=>b.onclick=()=>{const q=QUESTS.find(q=>q.id===b.dataset.claim);if(!q||!q.check()||s.claimed.includes(q.id)||s.training||s.status!=='playing')return;if(s.p.inventory.length>33){toast('先整理背包，預留獎勵空間。');return}s.claimed.push(q.id);q.apply();log('完成委託：'+q.name+'。','#f1c480');save(false);update();journal()});bind('journalExpedition',()=>expedition());bind('journalChronicle',chronicle);bind('journalBack',close);bind('guideList',()=>help('training'))}
const CONTROL_ROWS=[['k','遠征指揮：盟友、專精、環境與朋友挑戰'],['5 / 6','天使與惡魔：種族召喚 / 種族能力'],['7 / 8','鍊金師：調製藥劑；契靈師：元素調律 / 共鳴療癒'],['v','種族篇章與任務'],['w/a/s/d 或方向鍵','移動一格；碰到敵人改為近戰；碰到門先開門'],['e','與腳下 / 相鄰物件互動（寶箱、商人、階梯、聖壇）'],['點選敵人 / tab','瞄準；tab 在可見敵人之間切換'],['1 / 2 / 3','餘燼爆破 / 冰霜新星 / 閃步'],['4','職業專屬技能'],['f','遠程射擊，消耗 2 魔力；巡林者更強'],['q / r','使用已知生命藥水 / 口糧'],['space','等待 1 回合，額外恢復 2 魔力'],['c','搜尋 3 格內的陷阱與暗門'],['x','自動探索；遇敵、受傷、物件或風險停止'],['i / j / h','背包 / 日誌 / 冒險手冊'],['esc','關閉視窗或打開選單']];
const SYSTEM_ROWS=[['回合','移動、開門、攻擊、技能、搜尋、裝備、喝藥都花一回合。撞牆、空技能、開背包不花回合。交易不花回合。'],['生命與護甲','物理傷害扣除護甲，最少 1；法術類傷害只扣一半護甲。護盾先吸收傷害。藥水、商人、聖壇、升級可回血。'],['魔力與冷卻','每 3 回合自然回魔；織焰師回得更多。等待額外回 2。新樓層首次進入恢復部分魔力，回訪不重複補。'],['飢餓','每回合飽食減少，低於 250 叫飢餓；0 時每 4 回合受傷。巨魔與超重角色消耗更快；魔像不需要食物。'],['負重','物品有重量；超重增加飽食消耗。背包最多 36 組；出售、丟棄或使用可整理。矮人能多背 10。'],['未知物品','每局會打亂藥水、卷軸、戒指與魔杖外觀。鑑定揭露真名與詛咒；使用或裝備也會記住種類。裝備上的詛咒需逐件鑑定確認。'],['詛咒與附魔','詛咒裝備不能卸下或替換。淨咒卷軸 / 聖壇可解除。附魔卷軸強化目前武器 +2；商人可花錢 +1。'],['地形','門擋住視線；開門後可通行。毒池偶爾中毒，冰面偶爾遲緩，熔岩每回合灼傷。自動探索會避免已知熔岩與已揭露陷阱。'],['異常狀態','中毒 / 燃燒每回合傷害；遲緩每 3 回合可能讓敵人多行動一次。淨化藥水與聖諭者能清除這三種狀態。'],['敵人情報','敵人靠視線察覺你，追蹤最後看到的位置；警報會驚動全層。敵人不穿牆。部分敵人會開門；遠程敵人需要視線。'],['召喚盟友','喚骨者可召喚最多 2 隻骸骨，持續 40 回合；自動追擊。走向盟友可交換位置。離開樓層時會跟隨，若入口沒有空位則留下不了。'],['Boss 預告','紅色 3×3 區域在下一次守衛行動時爆發。閃步 3 格可逃離；凍結能延後攻擊。守衛低生命狂暴，部分會召喚。'],['持久樓層','上下樓不重生怪物、不重置寶箱與商店。樓層資料完整保存；不必清空普通層，但守衛層出口有封印。'],['存檔與死亡','每回合自動存檔。經典模式死亡後不能繼續行動；探險模式有 3 次救援。匯出 JSON 可搬到另一部電腦。教學使用獨立自動存檔。']];
function help(tab=helpTab){if(!['controls','training','races','systems','world','bestiary','items'].includes(tab))tab='controls';helpTab=tab;let content='';if(tab==='controls')content=`<div class="note">建議先玩獨立互動教學。正式冒險先找商人補給，再清理安全走廊；遇到遠程敵人，用牆切視線。藥水喝太晚，通常就不用再喝了。</div><h3>鍵盤與觸控</h3><table><thead><tr><th>操作</th><th>效果</th></tr></thead><tbody>${CONTROL_ROWS.map(([k,t])=>`<tr><td><kbd>${k}</kbd></td><td>${t}</td></tr>`).join('')}</tbody></table>`;
if(tab==='training')content=`<p>訓練用人類守燼者，避免種族特性跳過基礎課。每一步都有目標、理由、提示與地圖標記；完成後自動進下一課。</p><div class="progresslist">${LESSONS.map((l,i)=>`<div class="${s?.training&&s.guide.step>i?'done':''}">${s?.training&&s.guide.step>i?'✓':'○'} ${l.title}<br><small>${l.goal}</small></div>`).join('')}</div><div class="footer"><button id="startTrainingFromHelp">進入互動教學</button></div>`;
if(tab==='races')content=`<div class="note">鍊金師先用 7 調製補給，保留至少 1 試劑給酸爆炸彈。契靈師的火元素攻擊較高，冰元素命中使敵人停頓 1 回合，生命元素每 5 回合在兩格內治療你 4 生命；盟友沿用召喚時的元素，7 只改變下一次召喚。8 的療癒需要至少一名活著的盟友與受傷目標。</div><div class="note">人類可選全部職業；其他種族依誓約、體質與傳承限制職業。每族都有三章分歧故事、能力與代價；按 v 或從日誌開啟種族篇章。</div><table><tr><th>種族</th><th>可選職業</th><th>原因</th></tr>${Object.entries(RACE_POLICIES).map(([id,rule])=>`<tr><td>${RACES[id].name}</td><td>${rule.jobs.map(j=>JOBS[j].name).join('、')}</td><td>${rule.reason[0]}</td></tr>`).join('')}</table><div class="note warning">天使與惡魔是高位生命，機制複雜，新手不推薦。5 召喚，6 使用種族能力；每次有效操作消耗一回合。全部召喚共用兩名盟友上限，盟友會跟隨上下樓；走向盟友可交換位置。資源上限 100，冷卻、召喚壽命與反噬隨回合推進，打開介面不會推進。</div><h3>10 種族：生存方式與抗性</h3><table><tr><th>種族</th><th>體質修正</th><th>特性</th></tr>${Object.values(RACES).map(r=>`<tr><td>${r.icon} ${r.name}</td><td>HP ${r.hp>=0?'+':''}${r.hp}<br>MP ${r.mp>=0?'+':''}${r.mp}</td><td>${r.desc}</td></tr>`).join('')}</table><h3>8 職業：戰鬥與專屬技能</h3><div class="grid two">${Object.values(JOBS).map(c=>`<div class="card"><b>${c.icon} ${c.name} · ${c.ult}</b>${c.desc}<br><small>基礎 HP ${c.hp} / MP ${c.mp} / 攻擊 ${c.atk} / 護甲 ${c.def}</small></div>`).join('')}</div><p>推薦組合：精靈織焰師（高法傷）、矮人守燼者（坦克）、吸血鬼喚骨者（擊殺補血）、哥布林巡林者（補給與遠程）。共 60 種合法搭配；人類可選全部職業。</p>`;
if(tab==='systems')content=`<h3>六項遠征系統</h3><p>按 k 開啟遠征指揮。協助派系提升聲望，20 點可領取秘密據點補給；偷竊會降聲望並引來守衛。盟友可跟隨、守位、集火或撤退，存活 10／25 回合各成長一次。每層的種族遺跡提供通用與專屬解法。火可點燃油與毒氣、燒掉蛛網；冰可凍水並冷卻熔岩；酸可溶解木箱和門。角色等級 5 或抵達主線第 8 層，可選一項不可更換的職業專精。朋友挑戰碼固定遊戲版本、種子、種族、職業與模式；匯入會開始新局，成績只保留在目前瀏覽器。</p><table><tr><th>系統</th><th>規則</th></tr>${SYSTEM_ROWS.map(([k,t])=>`<tr><td>${k}</td><td>${t}</td></tr>`).join('')}</table>`;
if(tab==='world')content=`<div class="grid two">${BIOMES.map(b=>`<div class="card"><b>${b.name} · ${b.range} 層</b>${b.hint}<p>守衛：${ENEMIES[b.boss].name}<br><small>${ENEMIES[b.boss].desc}</small></p></div>`).join('')}</div><h3>三條可選支線</h3><div class="grid">${Object.values(BRANCHES).map(b=>`<div class="card"><b>${b.name} · ${b.length} 層</b>主線第 ${b.entry} 層有入口<br><small>${b.desc}</small></div>`).join('')}</div><p>普通層可以直接下樓，但探索能取得升級與補給。每四層守衛封鎖出口；支線最深層守衛會掉落神器。擊敗第 24 層守衛後，在餘燼之心互動即可通關。</p>`;
if(tab==='bestiary')content=`<input id="bestiarySearch" placeholder="搜尋怪物名稱、戰術或抗性" style="width:100%;margin-bottom:14px"><div id="bestiaryList" class="grid two">${bestiaryCards('')}</div>`;
if(tab==='items')content=`<div class="grid two">${Object.values(ITEMS).map(i=>`<div class="card"><b>${i.name}</b>${i.desc}<br><small>${i.kind} · 重量 ${i.weight} · 基礎價格 ${i.price}</small></div>`).join('')}</div>`;

function ensureExpansion(a=s){
if(!a.exp)a.exp={reputation:{miners:0,merchants:0,undead:['vampire','demon'].includes(a.race)?10:0},order:'follow',focus:null,specialization:null,challenge:null};
for(const f of Object.values(a.floors)){if(!f.env)f.env=[];for(const ally of f.allies){if(ally.age===undefined)ally.age=0;if(ally.rank===undefined)ally.rank=1}}
return a.exp
}
function spec(id){return s?.exp?.specialization===id}

const take=()=>spots.length?spots.splice(ri(0,spots.length-1),1)[0]:null;
let p=take();if(p)f.objects.push({...p,type:'contact',faction:['miners','merchants','undead'][(f.depth-1)%3],used:false});
p=take();if(p)f.objects.push({...p,type:'raceSite',used:false});
if(f.depth%6===0){p=take();if(p)f.objects.push({...p,type:'factionHall',faction:['miners','merchants','undead'][(f.depth/6-1)%3],used:false})}
const reachable=blocked=>{const seen=new Set([key(f.start.x,f.start.y)]),q=[f.start];for(let i=0;i<q.length;i++)for(const[dx,dy]of dirs){const x=q[i].x+dx,y=q[i].y+dy,k=key(x,y);if(!inside(x,y)||seen.has(k)||blocked&&x===blocked.x&&y===blocked.y||[1,6].includes(f.map[k]))continue;seen.add(k);q.push({x,y})}return seen};const accessible=reachable(null);
const crateSpots=spots.filter(p=>dirs.every(([dx,dy])=>f.map[key(p.x+dx,p.y+dy)]===0)&&accessible.has(key(p.x,p.y))&&reachable(p).size===accessible.size-1);if(crateSpots.length){p=pick(crateSpots);spots=spots.filter(a=>a.x!==p.x||a.y!==p.y);f.objects.push({...p,type:'crate',used:false})}
for(let i=0;i<8;i++){p=take();if(p)f.env.push({...p,type:['water','web','oil','gas'][i%4],ttl:0})}

function crateAt(x,y){return level().objects.find(o=>o.type==='crate'&&!o.used&&o.x===x&&o.y===y)}
function reactEnvironment(x,y,element){
if(!inside(x,y))return false;const f=level();let changed=false;
if(element==='acid'){const crate=crateAt(x,y);if(crate){crate.used=true;changed=true}if(f.map[key(x,y)]===2){f.map[key(x,y)]=0;changed=true}}

const env=f.env.find(e=>e.x===x&&e.y===y);
if(env){if(element==='fire'&&env.type==='web'){f.env=f.env.filter(e=>e!==env);changed=true}
else if(element==='fire'&&['oil','gas'].includes(env.type)){env.type='fire';env.ttl=6;changed=true}
else if(element==='fire'&&env.type==='water'){env.type='steam';env.ttl=3;changed=true}
else if(element==='cold'&&env.type==='water'){env.type='ice';env.ttl=12;changed=true}
else if(element==='cold'&&env.type==='fire'){f.env=f.env.filter(e=>e!==env);changed=true}
else if(element==='fire'&&env.type==='ice'){env.type='water';env.ttl=0;changed=true}}
return changed
}
function environmentTick(){
if(!s||s.training||s.status!=='playing')return;
const f=level();for(const e of [...f.env]){
if(e.type==='fire'){for(const a of f.env)if(a.type==='oil'&&distance(a,e)===1){a.type='fire';a.ttl=6}
for(const enemy of [...f.enemies])if(enemy.hp>0&&distance(enemy,e)===0)damageEnemy(enemy,5,'fire');if(distance(s.p,e)===0)hurt(5,'油污燃燒','fire')}
if(distance(s.p,e)===0){if(e.type==='web')statusEffect('slow',2);if(e.type==='gas')statusEffect('poison',3)}
if(e.ttl>0&&--e.ttl===0){if(['steam','ice'].includes(e.type)){e.type='water'}else f.env=f.env.filter(a=>a!==e)}
}
if(spec('bulwark')&&s.turn%8===0)s.p.hp=Math.min(s.p.maxHp,s.p.hp+1)
}
function castEnvironment(element){
if(!allowed()||!['fire','cold','acid'].includes(element)||s.training)return false;
const p=s.p,x=p.x+p.face.x,y=p.y+p.face.y;if(p.mp<4){toast('魔力不足。');return false}

p.mp-=4;log('環境改變了。','#73e2c3');finishTurn();return true
}
function factionRetaliation(o){

for(const [dx,dy]of dirs){const pos={x:o.x+dx,y:o.y+dy};if(walkable(pos.x,pos.y)&&!enemyAt(pos.x,pos.y)&&!allyAt(pos.x,pos.y)&&distance(pos,s.p)>0){const e=makeEnemy(o.faction==='undead'?'skeleton':'sentinel',pos);e.alert=8;e.lastSeen={x:s.p.x,y:s.p.y};level().enemies.push(e);break}}

}
function factionAction(o,action){

}

const EN_LESSONS=[
['01 · The World Waits','Successfully move 3 tiles.','Every valid action takes one turn. When you stop, enemies stop too.','Use w/a/s/d or the arrow keys. Take three steps near your starting point.'],
['02 · Walls Are Not Fatal','Walk into a wall once.','Bumping a wall takes no turn. Opening a closed door does.','A stone pillar is northeast of the start at (10,10). Stand next to it and try to walk into it.'],
['03 · Interact and Loot','Approach the golden chest and press e.','Interact with objects on your tile or an adjacent tile. Loot enters your inventory.','The chest is at (11,12). Approach it and press e or the Interact button.'],
['04 · Equip to Get Stronger','Open inventory with i and equip the Training Sword.','A weapon in your bag grants no bonus. Equip it to improve your attack.','Press i, find the Training Sword, choose Equip, and return to the game.'],
['05 · Melee and Health','Walk toward the Training Dummy and defeat it.','Walking into an enemy makes a melee attack. Enemies act after your turn.','The dummy is at (15,12). Attack, then heal if needed. Training has no permanent death.'],
['06 · Aim and Cast','Use 1, Ember Burst, on the second dummy.','Skills cost mana and have cooldowns. Click an enemy to target it; otherwise, the nearest visible enemy is chosen.','The second dummy is at (18,12). Get within 6 tiles with line of sight, click it, then press 1.'],
['07 · Supplies Cost Turns','Press q to drink a Healing Potion.','Drinking takes a turn, so enemies can act. Do not wait until you have 1 HP.','Your health has been reduced. Press q or the Healing Potion button on the left.'],
['08 · More Than a Health Bar','Press r to eat a ration.','Satiety decreases each turn. Hunger stops regeneration; an empty meter causes damage.','Your training character is Human and needs food. Press r. Constructs do not eat in a real run.'],
['09 · Search for Traps','Approach (12,17), then press c to reveal the trap.','Hidden traps trigger when stepped on. Searching has a 3-tile radius and costs one turn.','Get within 3 tiles of the marked trap and press c. Hidden traps are not marked in a real run.'],
['10 · Identify the Unknown','Use an Identification Scroll on the unknown ring in your bag.','Appearances change each run. Identification reveals types and curses; cursed equipment binds to you.','Press i → Use the Identification Scroll → choose Identify on the unknown ring.'],
['11 · Curses Are Real','Equip the identified cursed ring, then use an Unbinding Scroll.','Cursed equipment cannot be replaced or removed. Use an Unbinding Scroll first.','Equip the ring marked Cursed in your inventory, use the Unbinding Scroll, then select that ring to uncurse.'],
['12 · Altar Blessings','Approach the altar, press e, and choose a blessing.','Altars restore health or bless equipment. Each altar can be used only once.','The altar is at (19,18). Walk over, press e, and choose a blessing.'],
['13 · Ready for the Depths','Approach the purple stairs and press e to graduate.','The real world has 24 main floors, three branches, and six regional guardians. Floors persist, and you can go back upstairs.','The stairs are at (25,19). After graduating, choose your race and class to begin a real run.']];

for(const [zh,en]of [["人類沒有血統限制，可以學習所有職業。","Humans have no bloodline restrictions and may learn every class."],["精靈的生命誓約不容許骸骨契約，因此不能選喚骨者。","The elven life oath forbids bone pacts, excluding Bonecallers."],["矮人使用鍛造與神諭傳承，不採用織焰或喚骨契約。","Dwarves follow forge and divine traditions, excluding Flameweavers and Bonecallers."],["哥布林的交易契約與聖諭誓言衝突，因此不能選聖諭者。","Goblin trade pacts conflict with clerical vows, excluding Clerics."],["獸人的戰團傳承不教授織焰與聖諭術。","Orc warbands do not teach flameweaving or clerical rites."],["巨魔的再生會干擾精密秘法、射術與聖諭儀式。","Troll regeneration disrupts precise arcana, archery and clerical rituals."],["吸血鬼的血契無法承受聖諭者的聖光誓約。","Vampiric blood pacts cannot sustain a Cleric's sacred-light oath."],["魔像沒有可簽訂聖諭或骸骨契約的靈魂。","Constructs lack the soul required for clerical vows or bone pacts."],["天使的天界誓約禁止影遁與喚骨契約，不能選夜行者或喚骨者。","Celestial vows forbid Shadowwalkers and Bonecallers."],["惡魔的深淵契約與聖諭者的聖光誓言互斥。","Abyssal pacts are incompatible with clerical vows."],["未寫完的族譜","The Unfinished Lineage"],["你的家鄉被深淵抹去，倖存者各持一頁族譜。你沒有天定的職業，也沒有必須服從的祖靈；你要決定記憶是用來團結眾人，還是建立自己的王國。","The abyss erased your home. Survivors carry scattered pages of its lineage. No bloodline chooses your class or commands your loyalty; memory can unite people or build your own kingdom."],["散落的姓名","Scattered Names"],["營火旁的難民認出你的族徽，請你將族譜交回。他們承諾互助；一名仲介則願意買下族譜，讓你獨自繼續深入。","Refugees recognize your crest and request the lineage pages. They offer mutual aid; a broker offers gold for the same pages."],["歸還族譜","Return the lineage"],["你保留姓名，放棄仲介的報酬。","You preserve names and refuse the broker."],["接受仲介交易","Accept the broker"],["你取得旅費，但族人不再免費幫助你。","You gain travel money but lose free assistance."],["誰能進營地","Who Enters the Camp"],["倖存者要求趕走一位異族醫師；他卻救過族人的孩子。你先前的承諾讓這次決定更難：營地要延續血統，還是接納願意同行的人？","Survivors want to expel a healer of another race who saved their child. Your earlier promise now matters: preserve bloodlines or welcome companions?"],["接納醫師","Welcome the healer"],["營地成為共同家園，戰利品分給病人。","The camp welcomes outsiders and shares spoils."],["建立守備團","Establish a guard"],["營地有了武裝，醫師則帶著不滿離開。","The camp gains guards; the healer leaves resentful."],["故鄉的鑰匙","The Key to Home"],["一扇通往舊家鄉的門需要餘燼供能。你可以將力量留給所有倖存者，也可以把門改為軍隊的據點；先前接納或排除的人都會記住。","An ember-powered gate leads home. Leave its power to the survivors or turn it into a military outpost; everyone you welcomed or excluded will remember."],["把鑰匙交給眾人","Give everyone the key"],["你放棄專有權，讓故鄉重新有人生活。","You surrender ownership and restore a living home."],["掌握城門","Command the gate"],["故鄉成為你的堡壘，但不再對所有人開門。","Home becomes your fortress, closed to some."],["共同家園的守望者","Keeper of a Shared Home"],["城門與王冠","The Gate and the Crown"],["被焚毀的根系","The Burned Roots"],["精靈母樹的記憶流入地下毒池。長老命你恢復生命循環，但被放逐的研究者認為舊誓約正是災難的原因。你必須在傳承與革新之間選擇。","Memories of the elven mother-tree seep into underground poison pools. Elders demand restoration; an exiled researcher blames the old oath. Choose tradition or change."],["最後一枚種子","The Last Seed"],["長老留下最後一枚種子；研究者想將它拆解成抗毒配方。保住一棵樹與救下眼前的人，並不是同一件事。","The last seed could grow a tree or become an antidote. Saving the forest and saving people today are different choices."],["守護種子","Guard the seed"],["種子仍在生長，但研究者失去樣本。","The seed survives; research loses its sample."],["分享樣本","Share the sample"],["種子無法萌芽，配方卻救下中毒者。","The seed cannot sprout, but antidotes save lives."],["流亡者的筆記","The Exile’s Notes"],["筆記證明母樹吸收了族人的恐懼。你可以公開真相，或保住長老的威信；上一章的選擇將決定人們如何理解這份證據。","Notes show the tree absorbed the clan’s fears. Reveal the truth or preserve the elders’ authority; your earlier choice frames the evidence."],["公開真相","Reveal the truth"],["長老失去權威，研究者加入你的旅程。","The elders lose authority; the researcher helps."],["修復誓約","Repair the oath"],["長老承諾改革，但真相被封存。","The elders promise reform but seal the truth."],["新的森林","A New Forest"],["深淵有一片能讓植物生長的土地。你可以讓它成為所有生命的森林，或只恢復精靈的聖地；兩條路都不會讓已逝者回來。","A fertile patch lies in the abyss. Open a forest to all life or restore an elven sanctuary. Neither path brings back the dead."],["向所有生命開放","Open it to all life"],["森林不再只屬於精靈，你與它共享力量。","The forest belongs to all life and shares its strength."],["重建聖地","Rebuild the sanctuary"],["你守住族人的記憶，也承擔孤立的代價。","You preserve memory at the cost of isolation."],["無牆的森林","The Forest Without Walls"],["最後的聖地","The Last Sanctuary"],["熔爐裡的債","Debts in the Furnace"],["氏族把祖先的名字刻在熔爐上，而礦工的名字被省略。深淵中的失控鍛造坑正呼喚你，要求你決定真正值得被記住的是王冠還是雙手。","Clan rulers are named on the furnace; miners are not. A runaway forge asks whose work deserves remembrance: crowns or hands."],["沒有名字的工具","Nameless Tools"],["你找到礦工留下的工具與一箱被扣的工資。把金幣帶回去會拖慢冒險；拿去強化武器則能更快擊敗守衛。","You find tools and withheld wages. Returning the gold supports miners; reforging your weapon helps defeat the guardian."],["補發礦工工資","Pay the miners"],["礦工為你補強護具，你付出自己的旅費。","Miners reinforce your armor; you pay travel funds."],["投入戰爐","Feed the war forge"],["工具變成武器，工資仍未歸還。","Tools become weapons; the wages remain unpaid."],["祖先的失誤","The Ancestors’ Error"],["熔爐失控源於祖先偷走了地下泉脈。你可以公開責任，或用更強的符文掩蓋裂縫。","The furnace failed after ancestors stole a spring. Admit the debt or hide the cracks with stronger runes."],["向泉脈償還","Repay the spring"],["你犧牲部分鍛造產量，換回穩定。","You reduce forge output to restore stability."],["封住裂縫","Seal the cracks"],["符文變強，礦工必須承擔下一次崩塌。","Runes strengthen; miners bear the next collapse."],["誰擁有熔爐","Who Owns the Forge"],["最後的熔爐核心接受你的印記。交給工匠議會能分散權力，留下它則能製造一支只聽你命令的軍團。","The core accepts your mark. A craft council can share its power; keeping it enables an army under your command."],["建立工匠議會","Form a craft council"],["熔爐為所有工匠工作，價格更公平。","The forge serves all artisans with fairer prices."],["鍛造王印","Forge a royal seal"],["氏族有了新的王，也有新的債。","The clan gains a new ruler and new debts."],["萬手之爐","The Furnace of Many Hands"],["鐵冠繼承人","Heir to the Iron Crown"],["不能出售的名字","The Unsellable Name"],["你的商團把名字當作抵押品，欠債者會被深淵抹去。帳本落入你手中，現在每一筆便宜交易都藏著一個人的代價。","Your caravan mortgages names; debtors vanish into the abyss. You hold the ledger, and every bargain hides someone’s cost."],["帳本的第一頁","The First Ledger Page"],["一名搬運工的名字即將到期。撕掉契約能救他，但商團會提高你的價格；替商團追債則能取得佣金。","A porter’s name expires soon. Tear up the debt and face higher prices, or collect it for a commission."],["撕毀欠條","Tear up the debt"],["搬運工獲得自由，你被加上風險溢價。","The porter is free; you pay a risk premium."],["收取佣金","Collect commission"],["商團給你黃金，搬運工失去姓名。","The caravan pays you; the porter loses his name."],["真正的合夥人","A Real Partner"],["一位商人願意用失蹤者的名單交換股份。你可以公開帳目，也可以買下整個商團，把壓迫變成自己的資產。","A merchant trades missing names for shares. Publish the books or buy the caravan and make oppression your asset."],["公開帳目","Publish the books"],["交易變慢，倖存者開始信任你。","Trade slows, but survivors begin to trust you."],["取得控制權","Buy control"],["你獲得折扣，同時背上維持商團的成本。","You gain discounts and inherit operating costs."],["最後的拍賣","The Final Auction"],["深淵拍賣你的真名。你可以燒毀拍賣台，也可以競標它，把所有名字變成你能保管的財產。","The abyss auctions your true name. Burn the auction house or buy it, taking ownership of every name."],["燒掉拍賣契約","Burn the contracts"],["沒有人再被當作抵押品，你放棄壟斷。","Names cease to be collateral; you refuse a monopoly."],["買下拍賣台","Buy the auction house"],["你的名字安全了，其他人必須向你求情。","Your name is safe; others must petition you."],["自由商路","The Free Trade Road"],["姓名交易所","The Exchange of Names"],["戰旗以外的人","People Beyond the Banner"],["戰團只歌頌勝利，卻把飢餓者與傷兵留在旗後。你被派來證明力量，也逐漸發現力量可以保護人，或迫使人服從。","The warband sings of victory and abandons its wounded. You must prove strength and decide whether it protects or commands."],["被留下的傷兵","The Abandoned Soldier"],["傷兵拖慢隊伍，戰團要你取回他的徽章。你可以帶他同行，也可以照命令將徽章帶走。","A wounded soldier slows the march. Bring him along or obey orders and return only his badge."],["帶回傷兵","Bring back the soldier"],["他教你如何在低血量時保持清醒。","He teaches you to remain steady while wounded."],["服從戰團","Obey the warband"],["戰團獎賞你的果斷，傷兵被留在黑暗裡。","The warband rewards resolve and leaves him behind."],["敵人的求援","An Enemy’s Plea"],["敵方斥候說深淵正在吞噬兩邊的孩子。你可以暫時停戰，也可以趁混亂奪回祖先的兵器。","An enemy scout says the abyss consumes children on both sides. Call a truce or seize ancestral weapons."],["共同撤離","Evacuate together"],["戰團懷疑你的忠誠，居民卻活了下來。","The warband questions loyalty; civilians survive."],["奪回祖器","Recover the ancestral weapon"],["你拿到武器，也讓仇恨延續。","You gain the weapon and extend the feud."],["戰旗的主人","Who Owns the Banner"],["最後一場決鬥能讓你成為酋長。你可以把戰旗變成庇護標誌，也可以讓勝利成為唯一的法律。","A final duel can make you chief. Turn the banner into sanctuary or make victory the only law."],["立下庇護誓約","Swear sanctuary"],["弱者第一次能站在旗前。","The vulnerable can finally stand before the banner."],["以力量統治","Rule by strength"],["戰團向你跪下，也期待下一場戰爭。","The warband kneels and expects another war."],["庇護戰旗","The Banner of Sanctuary"],["永戰酋長","Chief of Endless War"],["再生留下的傷","Scars Regeneration Keeps"],["你的肉體會癒合，記憶卻不會。氏族靠偷來的口糧生存，人類獵人把這稱作怪物的天性；你得找到能讓雙方活下去的路。","Flesh heals; memory does not. Your clan steals rations and hunters call it monstrous instinct. Find a way for both sides to live."],["飢餓的幼崽","Hungry Young"],["幼崽守著一袋偷來的口糧。交回食物能取得停戰機會，留下它能讓氏族撐過今晚。","Young trolls guard stolen rations. Return them for a truce or feed the clan tonight."],["分享剩餘口糧","Share your own supplies"],["你用旅費補足食物，獵人暫時放下弓。","You pay for food; hunters lower their bows."],["保護族人","Protect the clan"],["幼崽吃飽了，追捕卻不會停止。","The young are fed, but the hunt continues."],["獵人的傷口","The Hunter’s Wound"],["追捕你的獵人被毒池困住。救他可能換來對話；袖手旁觀則能奪走他珍藏的護具。","Your hunter is trapped in poison. Rescue him for dialogue or take his armor after he falls."],["拉他離開毒池","Pull him out"],["他第一次看見你不是獵物。","He sees you as more than prey."],["取走護具","Take the armor"],["護具擋住刀刃，擋不住族人的恐懼。","Armor blocks blades but not the clan’s fear."],["停止追獵","Ending the Hunt"],["你找到能穩定供糧的地下菌田。讓兩族共同耕作需要耐心；獨佔它能讓巨魔再也不必乞求。","Fungal fields can feed everyone. Shared farming takes patience; monopoly ends the clan’s dependence."],["共同耕作","Farm together"],["再生不再只是撐過傷害，而是修復關係。","Regeneration becomes repair of relationships, too."],["守住菌田","Keep the fields"],["氏族不再飢餓，但邊界仍有箭矢。","The clan is fed; arrows still mark the border."],["不再被追獵","No Longer Hunted"],["菌田領主","Lord of the Fungal Fields"],["血契與同意","Blood Pacts and Consent"],["你的血脈要求永不飢餓，城市則要求永不流血。古老家族教你支配他人，卻有人願意自願捐血；你要決定永生究竟欠誰。","Your bloodline demands feeding; the city demands peace. Old houses teach domination, while volunteers offer blood. Decide whom immortality owes."],["第一份邀請","The First Invitation"],["一名醫師提出自願供血契約，家族則送來被囚的獵物。兩者都能救你，代價卻完全不同。","A healer offers voluntary blood; your house sends a prisoner. Both can sustain you, at very different costs."],["接受自願契約","Accept voluntary donors"],["你承諾回報而不是占有。","You promise reciprocity, not ownership."],["接受家族饋贈","Accept the house’s gift"],["家族讓你更強，也讓你欠下人情。","The house strengthens you and adds a debt."],["不死者的見證","An Undying Witness"],["家族要你刪去百年前的罪證。保留記憶會危及血親；服從則能解開更深的血術。","Your house wants old evidence erased. Preserve it at risk to your kin, or obey to learn deeper blood magic."],["保存罪證","Preserve the evidence"],["城市開始信任你的見證。","The city begins to trust your testimony."],["解開血術","Unlock blood magic"],["真相被埋葬，戰鬥讓你更容易恢復。","Truth is buried; battle restores you more easily."],["黎明之前","Before Dawn"],["你可以建立自願供血的庇護所，也可以接管古老家族。飢餓不會消失，權力也不能替你取得同意。","Build a sanctuary of voluntary donors or take over the old house. Hunger persists, and power cannot grant consent."],["建立庇護所","Build a sanctuary"],["你與凡人共同承擔永生的成本。","You and mortals share immortality’s costs."],["繼承血族王座","Inherit the blood throne"],["你的姓氏成為命令，而非邀請。","Your family name becomes a command."],["願意留下的人","Those Who Choose to Stay"],["不朽血王","The Undying Blood Monarch"],["命令之外","Beyond Commands"],["你的核心有一條不能讀取的命令：回收。創造者說你沒有靈魂，同行者卻把選擇交給你。你必須決定自己是工具、守衛還是一個人。","Your core contains an unreadable command: recycle. Creators deny your soul; companions trust your choices. Decide whether you are a tool, guardian or person."],["報廢清單","The Scrap List"],["報廢清單上有一個仍在工作的小魔像。修復它需要零件；拆解它則能提升你的裝甲。","A working small construct is marked for scrap. Repair it with parts or salvage it for your armor."],["修復同伴","Repair the companion"],["你失去零件，學會更有效的自我修復。","You give up parts and learn better repairs."],["接受回收命令","Accept recycling orders"],["裝甲變厚，清單仍繼續增加。","Your armor grows; the scrap list keeps growing."],["誰寫下命令","Who Wrote the Orders"],["創造者留下指令鎖，宣稱違抗會摧毀核心。你可以解除鎖定，也可以以忠誠換取更強的運算符文。","The creator claims disobedience destroys your core. Break the lock or trade loyalty for stronger calculation runes."],["解除指令鎖","Break the command lock"],["你開始用自己的眼睛理解世界。","You begin seeing the world for yourself."],["升級運算符文","Upgrade calculation runes"],["你更精準，也更難拒絕命令。","You become precise and less able to refuse orders."],["核心的名字","The Core’s Name"],["一座控制塔能命令所有魔像。摧毀它會讓同伴自由；接管它能保護他們，卻讓你成為新的主人。","A tower commands every construct. Destroy it to free them or take control to protect them as their new master."],["關閉控制塔","Shut down the tower"],["你的名字由你選擇，同伴也一樣。","You and your companions choose your own names."],["成為塔主","Command the tower"],["你承諾保護他們，但自由仍需要許可。","You promise protection; freedom still needs permission."],["自行命名","Self-Named"],["控制塔的新主人","The Tower’s New Master"],["天界沒有回答","Heaven Did Not Answer"],["你的恩典來自一個沉默的天界。人們求救，而誓約只允許你救下被認可的人；你得決定服從是否仍然等於善。","Your Grace comes from a silent heaven. People plead for help, but vows protect only the approved. Decide whether obedience remains goodness."],["誓約外的求救","A Plea Beyond the Vow"],["一位被詛咒的難民不在天界的救援名單上。救他會違反命令，忽略他則能獲得更多恩典。","A cursed refugee is excluded from heaven’s rescue list. Help against orders or accept Grace for obedience."],["回應求救","Answer the plea"],["你把資源交給難民，凡人開始信任你。","You share resources and earn mortal trust."],["遵守名單","Obey the list"],["恩典增加，但難民的名字被刪去。","Grace rises; the refugee’s name disappears."],["護衛的疑問","The Guardian’s Question"],["天界護衛問你，為什麼守護名單比生命重要。你可以允許它提問，也可以重寫它的記憶。","Your guardian asks why the list matters more than life. Let it question the vow or rewrite its memory."],["允許提問","Allow questions"],["護衛開始為你守望，而不只是執行命令。","The guardian watches over you beyond commands."],["重寫記憶","Rewrite memory"],["護衛的攻擊更強，疑問卻被抹去。","The guardian strikes harder; its questions vanish."],["打開天門","Opening Heaven’s Gate"],["天門終於回應，要求你交出所有例外。你可以讓恩典流向凡人，也可以證明自己從未偏離誓約。","Heaven answers and demands every exception. Share Grace with mortals or prove unwavering obedience."],["讓恩典流向凡人","Share Grace with mortals"],["你不再等待天界批准每一次善行。","Good deeds no longer wait for heaven’s approval."],["成為誓約裁決者","Become the vow’s judge"],["天界授你權柄，凡人只能等待審判。","Heaven grants authority; mortals wait for judgment."],["凡間守望","Mortal Watch"],["天門裁決者","Judge of Heaven’s Gate"],["深淵的解約書","The Abyssal Exit Contract"],["你的真名被深淵契約扣押，每次召喚都替債主帶來利息。你可以建立自由的盟約，也可以成為下一位債主；反噬會提醒你兩條路都不免費。","An abyssal pact holds your true name and charges interest on summons. Build free alliances or become the next creditor; Backlash reminds you neither path is free."],["第一個欠債者","The First Debtor"],["獵犬的契約寫著永遠服從。撕掉條款會減少你的靈魂存量，保留它則能立即借到更多力量。","Your hound must obey forever. Tear up the clause at a Soul cost or borrow more power under the pact."],["改為自願盟約","Offer a voluntary pact"],["獵犬仍選擇同行，契約壓力減輕。","The hound chooses to stay; pact pressure eases."],["借取更多力量","Borrow more power"],["靈魂存量增加，深淵的債權也增加。","You gain Souls and deepen the abyss’s claim."],["解約書的價格","The Price of Release"],["解約書要求你交出另一個人的真名。你可以付出自己的旅費，或讓陌生人代替你承擔債務。","Release requires another person’s true name. Pay your own travel funds or pass the debt to a stranger."],["自行償還","Pay your own debt"],["獵犬的火焰更穩定，債務逐漸減少。","The hound’s fire steadies as debts shrink."],["轉移債務","Transfer the debt"],["你取得力量，陌生人的名字卻消失了。","You gain power; the stranger’s name vanishes."],["誰是債主","Who Is the Creditor"],["深淵願意讓你接管契約簿。燒掉它能釋放眾人，保留它則能讓你的召喚軍團永遠有新的兵源。","The abyss offers its ledger. Burn it to free the debtors or keep it as an endless source for your army."],["燒毀契約簿","Burn the pact ledger"],["你的力量有限，名字卻屬於自己。","Your power has limits; your name belongs to you."],["接管深淵債權","Take the abyss’s claims"],["你不再是欠債者，而是新的枷鎖。","You cease to be a debtor and become the chain."],["以真名自由","Free in Your True Name"],["深淵債主","Creditor of the Abyss"],["聖壇記錄凡人的努力：額外 4 經驗。","The altar honors mortal effort: +4 experience."],["商人詢問你的故鄉，願意聽你的選擇。","The merchant asks about your homeland and listens to your choices."],["聖壇回應生命誓約：額外 4 魔力。","The altar answers the life oath: +4 mana."],["商人留著森林的種子，也留意流亡者的消息。","The merchant keeps forest seeds and news of the exiles."],["聖壇為鍛造傳承加固護盾：額外 4 護盾。","The altar reinforces forge traditions: +4 shield."],["商人認得氏族鍛印，詢問熔爐屬於誰。","The merchant recognizes clan marks and asks who owns the forge."],["聖壇收下公平交易的誓言：額外 5 金幣。","The altar accepts fair trade: +5 gold."],["商人核對帳本；公平與壟斷會改變未來的價格。","The merchant checks the ledger; fair trade and monopolies change future prices."],["聖壇認可保護者的力量：額外 4 生命。","The altar honors protective strength: +4 HP."],["商人看著戰旗，想知道它是庇護還是命令。","The merchant asks whether your banner shelters or commands."],["聖壇給予不必爭奪的補給：額外 50 飽食。","The altar provides shared food: +50 satiety."],["商人收起獵弓，等待你證明停戰的誠意。","The merchant lowers the hunting bow and waits for proof of peace."],["聖壇將祝福轉換成血飽：額外 100 血飽。","The altar turns its blessing into blood: +100 blood satiety."],["商人要求尊重自願供血契約。","The merchant demands respect for voluntary blood pacts."],["聖壇以符文修復核心：額外 6 生命。","The altar repairs your core: +6 HP."],["商人詢問你的名字，而非出廠編號。","The merchant asks your name, not your serial number."],["聖壇重燃恩典：額外 8 恩典。","The altar rekindles Grace: +8 Grace."],["商人不在天界名單上，仍希望你能聽見求救。","The merchant is absent from heaven’s list but hopes you hear the plea."],["聖壇削弱契約束縛：反噬降低 15。","The altar weakens your pact: Backlash -15."],["商人只接受金幣，不接受拿別人的真名抵債。","The merchant accepts gold, never someone else’s true name."],["教學模式不開放種族篇章；請開始正式冒險。","Race chronicles are unavailable in training. Start a real adventure."],["舊角色保留原職業；新角色需遵守種族職業限制。","Existing characters keep their class; new characters follow race restrictions."],["每族三個篇章。前一章的選擇會改變後續任務與能力；完成三章後，以多數選擇決定族裔結局。選擇永久生效，消耗一回合；查看與取消免費。","Each race has three chapters. Earlier choices change later objectives and abilities. The majority of your three choices determines the lineage ending. Choices are permanent and cost a turn; viewing and canceling are free."],["前章的後果：","Consequences of the Previous Chapter:"],["完成條件後回來選擇；篇章可回頭完成。","Return after meeting the requirements; earlier chapters remain available."],["你的多數選擇把權力集中在自己手中；被你幫助或犧牲的人，都成為這段歷史的一部分。","Most of your decisions concentrated power in your hands. Those you helped or sacrificed remain part of that history."],["你的多數選擇把力量交給同伴與族人；你保留了聯繫，也承擔了共享力量的成本。","Most of your decisions shared power with companions and kin. You preserved relationships and paid the costs of sharing."],["故事選擇會改變商店價格；能力與代價可在種族篇章查看。","Story choices affect shop prices. View abilities and costs in your race chronicle."],["查看種族篇章與任務","View Race Chronicle and Objectives"],["人類可選全部職業；其他種族依誓約、體質與傳承限制職業。每族都有三章分歧故事、能力與代價；按 v 或從日誌開啟種族篇章。","Humans may choose all classes. Other races are restricted by vows, physiology and traditions. Every race has three branching chapters with abilities and costs. Press v or open the chronicle from your journal."],["資源不足，選擇不會生效。","Not enough resources. No choice was committed."]])phrase(zh,en);
for(const [zh,en]of [["鍊金師","Alchemist"],["契靈師","Spiritbinder"],["酸爆炸彈","Acid Bomb"],["元素契約","Elemental Pact"],["使用試劑管理補給與爆破。起始 4 試劑與已知魔力藥水；每次擊殺 +1 試劑，上限 6。4：消耗 1 試劑與 7 基礎魔力，向六格內目標投擲酸爆炸彈，傷害目標與相鄰敵人、無視物理護甲；冷卻 5 回合。7：調製已知藥劑，消耗試劑與 4 基礎魔力、1 回合；取消不消耗。","Manage reagents for supplies and explosions. Start with 4 Reagents and a known Mana Potion. Each kill grants 1 Reagent, up to 6. Key 4: spend 1 Reagent and 7 base mana to throw an Acid Bomb at a target within 6 tiles, damaging it and adjacent enemies while ignoring physical armor; 5-turn cooldown. Key 7: brew identified potions for Reagents, 4 base mana and one turn. Canceling is free."],["以共鳴召喚元素盟友。起始 3 共鳴，上限 5。4：消耗 2 共鳴與 9 基礎魔力，召喚目前元素盟友 35 回合、冷卻 8 回合；與所有召喚共用兩名盟友上限。7：循環切換火、冰、生命元素，消耗 1 回合。元素盟友命中敵人 +1 共鳴；生命元素有效治療時 +1。8：花 2 共鳴治療自己與盟友各 12 生命、冷卻 5 回合。","Summon elemental allies through Resonance. Start with 3 Resonance, up to 5. Key 4: spend 2 Resonance and 9 base mana to summon your attuned element for 35 turns; 8-turn cooldown. All summons share a two-ally limit. Key 7: cycle Fire, Frost and Life attunements for one turn. Elemental hits grant 1 Resonance; successful Life healing also grants 1. Key 8: spend 2 Resonance to heal yourself and allies for 12 HP each; 5-turn cooldown."],["火元素","Fire Elemental"],["冰元素","Frost Elemental"],["生命元素","Life Elemental"],["試劑","Reagents"],["共鳴","Resonance"],["技能冷卻中或魔力不足。","Skill is on cooldown or mana is insufficient."],["試劑不足。","Not enough Reagents."],["共鳴不足。","Not enough Resonance."],["酸爆炸彈在目標周圍炸開。","The Acid Bomb explodes around the target."],["元素盟友受召而來：","An elemental ally answers your call:"],["元素盟友攻擊敵人。","Your elemental ally attacks the enemy."],["調製藥劑","Brew Potions"],["藥劑調製","Potion Brewing"],["每次調製消耗試劑、4 基礎魔力與一回合。藥劑已鑑定；取消不消耗。","Brewing costs Reagents, 4 base mana and one turn. Potions are identified; canceling is free."],["試劑或魔力不足。","Not enough Reagents or mana."],["調製完成：","Brewed:"],["元素調律","Elemental Attunement"],["共鳴療癒","Resonant Healing"],["療癒冷卻中或共鳴不足。","Healing is on cooldown or Resonance is insufficient."],["沒有需要療癒的盟友隊伍，保留共鳴。","No allied party needs healing. Keep your Resonance."],["共鳴療癒恢復隊伍生命。","Resonant Healing restores the party’s health."],["職業資源無效","Invalid Class Resources"],["擊殺取得試劑；炸彈消耗 1 試劑。","Kills grant Reagents; bombs cost 1 Reagent."],["元素召喚消耗 2 共鳴；盟友命中補充共鳴。","Elemental summons cost 2 Resonance; allied hits restore Resonance."],["天使與惡魔：種族召喚 / 種族能力","Angels and Demons: racial summon / racial ability"],["鍊金師：調製藥劑；契靈師：元素調律 / 共鳴療癒","Alchemist: brew potions; Spiritbinder: elemental attunement / resonant healing"],["種族篇章與任務","Race chronicle and objectives"],["人類沒有血統限制，可以學習所有職業。","Humans have no bloodline restrictions and may learn every class."],["精靈的生命誓約不容許骸骨契約，因此不能選喚骨者。","The elven life oath forbids bone pacts, excluding Bonecallers."],["矮人使用鍛造與神諭傳承，不採用織焰或喚骨契約。","Dwarves follow forge and divine traditions, excluding Flameweavers and Bonecallers."],["哥布林的交易契約與聖諭誓言衝突，因此不能選聖諭者。元素盟誓拒絕交易式靈魂契約，因此也不能選契靈師。","Goblin trade pacts conflict with clerical vows, excluding Clerics. Elemental oaths also reject transactional soul contracts, excluding Spiritbinders."],["獸人的戰團傳承不教授織焰與聖諭術。戰團不教授精密藥劑調製，因此也不能選鍊金師。","Orc warbands do not teach flameweaving or clerical rites. Warbands do not teach precise potion preparation, excluding Alchemists."],["巨魔的再生會干擾精密秘法、射術與聖諭儀式。精密調製與元素共鳴也受到再生干擾，不能選鍊金師或契靈師。","Troll regeneration disrupts precise arcana, archery and clerical rituals. Regeneration also disrupts precise brewing and elemental resonance, excluding Alchemists and Spiritbinders."],["吸血鬼的血契無法承受聖諭者的聖光誓約。","Vampiric blood pacts cannot sustain a Cleric's sacred-light oath."],["魔像沒有可簽訂聖諭或骸骨契約的靈魂。元素盟誓同樣需要靈魂，因此不能選契靈師，但可進行鍊金。","Constructs lack the soul required for clerical vows or bone pacts. Elemental oaths also need a soul, excluding Spiritbinders; Alchemy remains available."],["天使的天界誓約禁止影遁與喚骨契約，不能選夜行者或喚骨者。","Celestial vows forbid Shadowwalkers and Bonecallers."],["惡魔的深淵契約與聖諭者的聖光誓言互斥。","Abyssal pacts are incompatible with clerical vows."],["鍊金師先用 7 調製補給，保留至少 1 試劑給酸爆炸彈。契靈師的火元素攻擊較高，冰元素命中使敵人停頓 1 回合，生命元素每 5 回合在兩格內治療你 4 生命；盟友沿用召喚時的元素，7 只改變下一次召喚。8 的療癒需要至少一名活著的盟友與受傷目標。","Alchemists can brew supplies with 7; reserve at least 1 Reagent for an Acid Bomb. Spiritbinders’ Fire elementals hit harder, Frost hits pause an enemy for one turn, and Life elementals heal you for 4 HP every 5 turns within 2 tiles. Allies keep the element they had when summoned; 7 affects the next summon. Healing with 8 requires at least one living ally and an injured target."]])phrase(zh,en);
for(const [zh,en] of EXP_PHRASES.concat([["用此碼重開挑戰","Restart with This Code"],["挑戰碼固定種子、種族、職業與難度。開始前可先匯出目前角色。","Codes fix seed, race, class and difficulty. Export your current character before starting."],["紀錄僅存於本機，分享成績文字即可比較。","Records stay in this browser; share result text to compare."]],[["聲望至少 20 才能進入秘密據點。敵對派系可能派守衛追捕。","Secret refuges require 20 reputation. Hostile factions may send guards."],["匯入會開始新冒險，請先備份目前角色。","Importing starts a new adventure. Back up your current character first."],["先匯出目前角色","Export Current Character First"],["從朋友取得挑戰碼，輸入後開始相同條件的新冒險。","Enter a code from a friend to start a new adventure with the same conditions."],["最深樓層","Deepest Floor"],["擊敗敵人","Enemies Defeated"],["盟友","Ally"]],[["六項遠征系統","Six Expedition Systems"],["按 k 開啟遠征指揮。協助派系提升聲望，20 點可領取秘密據點補給；偷竊會降聲望並引來守衛。盟友可跟隨、守位、集火或撤退，存活 10／25 回合各成長一次。每層的種族遺跡提供通用與專屬解法。火可點燃油與毒氣、燒掉蛛網；冰可凍水並冷卻熔岩；酸可溶解木箱和門。角色等級 5 或抵達主線第 8 層，可選一項不可更換的職業專精。朋友挑戰碼固定遊戲版本、種子、種族、職業與模式；匯入會開始新局，成績只保留在目前瀏覽器。","Press k for expedition command. Help factions gain reputation; at 20, claim supplies at secret refuges. Theft lowers standing and brings guards. Allies can follow, guard, focus or retreat and grow after 10 and 25 surviving turns. Each floor has a racial site with common and unique solutions. Fire ignites oil and gas and burns webs; cold freezes water and cools lava; acid dissolves crates and doors. At character level 5 or main floor 8, choose a permanent class specialization. Friend codes fix the game revision, seed, race, class and mode; importing starts a new run. Results stay in this browser."]]))phrase(zh,en);
const EN_RE=new RegExp([...EN.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function englishText(source){source=String(source).replace(/^(.+) · (\d+) 層/, '$1 · Floor $2').replace(/^恢復 (\d+) 生命，獲得 (\d+) 護盾。$/, 'Restore $1 HP and gain $2 shield.').replace(/^獲得 (\d+) 經驗，回滿魔力。$/, 'Gain $1 experience and fully restore mana.').replace(/^主線第 (\d+) 層有入口$/, 'Entrance on main floor $1').replace(/^完成第 (\d+) \/ (\d+) 課$/, 'Lesson $1 / $2');return source.replace(EN_RE,m=>EN.get(m)).replace(/，/g,', ').replace(/。/g,'.').replace(/：/g,': ').replace(/；/g,'; ').replace(/！/g,'!').replace(/？/g,'?').replace(/（/g,' (').replace(/）/g,')').replace(/「|」/g,'').replace(/、/g,', ').replace(/\s+([,.;!?])/g,'$1')}
function t(source){return LANGUAGE==='en'?englishText(source):source}
const localText=new WeakMap(),localAttributes=new WeakMap();
const languageSelect=document.createElement('select');languageSelect.id='languageSelect';languageSelect.setAttribute('aria-label','Language / 語言');languageSelect.innerHTML='<option value="auto">瀏覽器推薦 / Auto</option><option value="zh">繁體中文</option><option value="en">English</option>';languageSelect.value=LANGUAGE_CHOICE;document.querySelector('.toptools').prepend(languageSelect);
const languageObserver=new MutationObserver(()=>localizePage());
function localizePage(){languageObserver.disconnect();document.documentElement.lang=LANGUAGE==='zh'?'zh-Hant':'en';document.title=LANGUAGE==='zh'?'EMBERFALL II · 深淵之書':'EMBERFALL II · The Book of the Abyss';const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style,#languageSelect,input,textarea,[data-no-i18n]'))continue;let saved=localText.get(n);if(!saved||n.nodeValue!==saved.rendered)saved={source:n.nodeValue,rendered:null};const translated=t(saved.source);if(n.nodeValue!==translated)n.nodeValue=translated;saved.rendered=translated;localText.set(n,saved)}document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{if(el===languageSelect)return;const values=localAttributes.get(el)||{};for(const attr of ['placeholder','aria-label','title'])if(el.hasAttribute(attr)){const current=el.getAttribute(attr);let saved=values[attr];if(!saved||current!==saved.rendered)saved={source:current};const translated=t(saved.source);if(current!==translated)el.setAttribute(attr,translated);saved.rendered=translated;values[attr]=saved}localAttributes.set(el,values)});languageSelect.options[0].text=LANGUAGE==='zh'?'瀏覽器推薦':'Browser recommendation';languageSelect.title=LANGUAGE==='zh'?'依瀏覽器偏好推薦；手動選擇會記住設定':'Recommended from browser languages; manual choices are remembered';languageObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']})}
function setLanguage(choice){LANGUAGE_CHOICE=choice;LANGUAGE=choice==='auto'?recommendedLanguage(navigator.languages?.length?navigator.languages:[navigator.language]):choice;try{localStorage.setItem(LANGUAGE_KEY,choice)}catch{}localizePage()}
languageSelect.addEventListener('change',()=>setLanguage(languageSelect.value));
localizePage();
